name: Check design system
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    # Browsers and their system libraries come preinstalled, so CI never waits on apt mirrors.
    # Keep the tag equal to the installed @playwright/test version.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:browser
      - run: npm run test:distribution
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
